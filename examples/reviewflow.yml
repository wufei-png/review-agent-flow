version: 1

pipeline_gate: true

human:
  enabled: true
  reviewers:
    - gitlab-username

ai:
  enabled: false
  command:
    - opencode
    - run
  skill: .gitlab/review-agent/SKILL.md
  auto_fix: false

notifications:
  channels:
    - id: feishu-reviewers
      type: feishu
      webhook_env: FEISHU_WEBHOOK
    - id: wecom-reviewers
      type: wecom
      webhook_env: WECOM_WEBHOOK
