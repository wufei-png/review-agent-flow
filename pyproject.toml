[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "review-agent-flow"
version = "0.1.0"
description = "A GitLab human and AI review workflow orchestrator with local Agent support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wufei-png" }]
dependencies = [
  "fastapi>=0.115,<1",
  "PyYAML>=6.0,<7",
  "python-gitlab>=4,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff==0.16.1",
]

[project.scripts]
review-agent-flow = "review_agent_flow.cli:main"
review-agent-flow-opencode = "review_agent_flow.opencode_auth_wrapper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent_flow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "C4", "ASYNC", "DTZ", "PIE", "S501", "S502", "S506"]
